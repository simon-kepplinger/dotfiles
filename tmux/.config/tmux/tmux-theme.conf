# move bar to the top + one line spacing
set-option -g status-position top
set -g status 2

# copy mode info
set -g status-format[1] "#[align=left]#{?pane_in_mode,#[bg=#ffff00]#[fg=#0a0c10] COPY MODE ,}"
set -ga status-format[1] "#[align=right]#{?pane_in_mode,#[bg=#ffff00]#[fg=#0a0c10] COPY MODE ,}"

# tweak theme
set -g @catppuccin_flavor 'mocha'
set -g @thm_green "#26cd4d"
set -g @thm_blue "#71b7ff"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(Z),}"
set -g @catppuccin_window_current_text_color "#{@thm_blue}fg=#{@thm_overlay_0}"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"

# tmux-agent-indicator: splice plugin's per-window window-status-style into catppuccin colors
set -g @agent-indicator-needs-input-window-title-bg "#f9e2af"
set -g @agent-indicator-needs-input-window-title-fg "#11111b"
set -g @agent-indicator-done-window-title-bg "#26cd4d"
set -g @agent-indicator-done-window-title-fg "#11111b"
set -g @agent-indicator-notification-enabled "off"
set -g @catppuccin_window_number_color "#{?#{m:bg=*,#{window-status-style}},#{s/^bg=//:window-status-style},#{@thm_overlay_2}}"
set -g @catppuccin_window_text_color "#{?#{m:bg=*,#{window-status-style}},#{s/^bg=//:window-status-style},#{@thm_surface_0}}"

set -g @catppuccin_pane_border_style "fg=#313131"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#ffffff,##{?pane_synchronized,fg=#{@thm_mauve},fg=#ffffff}}"

set -g @catppuccin_status_left_separator "█"

set -g status-right-length 100
set -g status-left-length 100
set -g status-right ""
set -g status-left "#{E:@catppuccin_status_session}#[default] "
set -g status-bg "#181c24" 

set -g pane-border-lines heavy

